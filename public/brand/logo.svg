<svg xmlns="http://www.w3.org/2000/svg" width="176" height="32" viewBox="0 0 176 32" fill="none" role="img" aria-label="Smile Lab">
  <title>Smile Lab</title>
  <!-- Marca: cuadrado redondeado con una sonrisa. Un solo color: el primary
       del sistema (#2FA6B4). Si cambia el token, cambiar acá también. -->
  <rect x="0" y="2" width="28" height="28" rx="9" fill="#2FA6B4" />
  <path
    d="M8.6 15.4c0 3.2 2.4 5.8 5.4 5.8s5.4-2.6 5.4-5.8"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <circle cx="10.9" cy="11.3" r="1.55" fill="#FFFFFF" />
  <circle cx="17.1" cy="11.3" r="1.55" fill="#FFFFFF" />
  <!-- Wordmark: Sora si está disponible, si no la sans del sistema. -->
  <text
    x="38"
    y="21.6"
    font-family="Sora, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="17.5"
    font-weight="600"
    letter-spacing="-0.5"
    fill="#2FA6B4"
  >Smile Lab</text>
</svg>
