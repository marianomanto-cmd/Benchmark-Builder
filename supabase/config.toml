# Configuración del proyecto local de Supabase.
# `supabase start` levanta Postgres, Auth, Storage y Studio.
project_id = "smile-lab-presupuestos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Sesión larga: el profesional entra desde su celular entre pacientes.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sólo magic link. Sin password, sin signups abiertos.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
